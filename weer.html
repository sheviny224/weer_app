<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="weer.css" />
    <title>Weer</title>
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="voer stad naam:" spellcheck="false" />

        <button><img src="images/search.png" /></button>
      </div>
      <div class="weer">
        <img src="images/rain.png" class="weer-icon" />
        <h1 class="temp">20°C</h1>
        <h2 class="stad">Amsterdam</h2>
        <div class="details">
          <div class="col">
            <img src="images/humidity.png" />
            <div>
              <p class="vochtig">50%</p>
              <p>Vochtigheid</p>
            </div>
          </div>

          <div class="col">
            <img src="images/wind.png" />
            <div>
              <p class="wind">15 km/u</p>
              <p>Wind</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiKey = "dff8d0493a4739c21162e5cafd37c728";
      const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?units=metric&q=utrecht";

      async function checkWeer() {
        const responce = await fetch(apiUrl + "&appid=${apiKey}");
        var data = await response.json();

        console.log(data);

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = data.main.temp;
        document.querySelector(".vochtig").innerHTML = data.main.vochtig;
        document.querySelector(".wind").innerHTML = data.main.wind;
        document.querySelector(".").innerHTML = data.main.temp;
      }

      checkWeer();
    </script>
  </body>
</html>
